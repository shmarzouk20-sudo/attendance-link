<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور وإجازات المهندسين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#17203a;--mut:#6a7490;--pri:#3b5bdb;--ok:#12a150;--off:#e8590c;--bd:#e3e7f1;--sh:0 1px 4px rgba(20,30,60,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182032;--tx:#e8ecf6;--mut:#93a0bd;--pri:#7b97ff;--ok:#4ade80;--off:#fb923c;--bd:#26304a;--sh:none}}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:960px;margin-inline:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px}
header{background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header h1{margin:0;font-size:19px}.tag{background:rgba(255,255,255,.22);border-radius:20px;padding:1px 10px;font-size:12px}
.usr{display:flex;align-items:center;gap:8px;font-size:13px}.usr button{background:#fff;color:#3b5bdb;border:0;font-weight:700}
#days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{height:68px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;white-space:nowrap;box-shadow:var(--sh);border-radius:14px}
.day b{font-size:15px}.day small{font-size:11px;color:var(--mut);line-height:1.25}
.day.on{background:var(--pri);border-color:var(--pri);color:#fff}.day.on small{color:#e6ecff}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--pri);color:#fff}
section[hidden]{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:620px){.cols{grid-template-columns:1fr}.day b{font-size:12px}.day small{font-size:10px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.badge{border-radius:20px;padding:1px 12px;color:#fff;font-size:15px}
.p .badge{background:var(--ok)}.l .badge{background:var(--off)}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.row .n{flex:1;line-height:1.3}.row .n small{display:block;color:var(--mut);font-size:12px}
.ic{width:30px;height:30px;padding:0;border-radius:50%;font-size:18px;line-height:1;font-weight:700}
.minus{color:var(--off)}.plus{color:var(--ok)}.pen{font-size:12px}
.sub{color:var(--mut);font-size:13px}
.edit,.gedit{display:none}body.att .edit,body.grp .gedit{display:revert}
.brush{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.br{border:2px solid var(--c);color:var(--c);font-weight:700;border-radius:24px;padding:6px 16px;background:transparent}
.br.on{background:var(--c);color:#fff}
.hint{color:var(--mut);font-size:13px;margin-bottom:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:36px}
.chip{border-radius:20px;padding:5px 14px;font-size:14px;background:var(--bg);border:1px solid var(--bd)}
body:not(.grp) .chip{pointer-events:none}
.pool .chip{border-style:dashed}
#gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gc{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card)}
.gh{background:var(--c);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}.gh b{flex:1}
.cnt{background:rgba(255,255,255,.28);border-radius:20px;padding:0 10px}
.xb{background:#fff;color:#a16207;border-radius:20px;padding:0 8px;font-size:12px;font-weight:700}
.xbtn{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:28px;height:28px;padding:0}.xbtn.on{background:#fff;color:#a16207}
.gm{padding:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px}
.gm .chip{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:var(--c)}
#xp{margin-top:12px;padding:10px 14px;border-radius:14px;background:#fef3c7;color:#854d0e;font-weight:700}
#logs{margin-top:14px;font-size:13px;color:var(--mut)}#logs div div{padding:4px 0;border-bottom:1px dashed var(--bd)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);min-width:270px}
dialog input{width:100%;padding:9px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
#msg{color:var(--off);font-size:13px}.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body>
<header>
  <div><h1>📅 حضور وإجازات المهندسين</h1></div>
  <div class="usr"><span id="who"></span><button id="loginBtn">دخول للتعديل</button></div>
</header>
<nav id="days"></nav>
<div class="tabs"><button data-t="att" class="on">📋 الحضور والإجازات</button><button data-t="grp">👥 المجموعات</button></div>

<section id="vAtt" class="cols">
  <div class="card p"><h2><span>✅ الحاضرون</span><span class="badge" id="pc">0</span></h2><div id="pl"></div></div>
  <div class="card l"><h2><span>🏖️ الإجازة</span><span class="badge" id="lc">0</span></h2><div id="ll"></div></div>
</section>

<section id="vGrp" hidden>
  <div class="card">
    <div class="gedit"><div class="hint">1) اختر مهندس الورشة  2) اضغط على أسماء الاستقبال لتوزيعها  — اضغط على اسم داخل مجموعة لإزالته، و ⚡ لتحديد الاكسبريس</div>
      <div class="brush" id="brush"></div></div>
    <div class="hint">بدون مجموعة:</div><div class="pool" id="pool"></div>
    <div id="gcards"></div>
    <div id="xp"></div>
  </div>
</section>

<div class="card" id="logs"><b>سجل التعديلات (آخر 15)</b><div id="logList"></div></div>

<dialog id="dlg"><form method="dialog" id="f">
  <b>تسجيل الدخول</b>
  <input id="u" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <div id="msg"></div>
  <button type="submit" class="pri">دخول</button> <button type="button" id="cancel">إلغاء</button>
</form></dialog>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBCstzJM1AUQSoCGT0KWE5_rK8uSG5SwME",
  authDomain: "shaban-marzouk.firebaseapp.com",
  projectId: "shaban-marzouk",
  appId: "1:415194562233:web:7eb8cde1697982fbb2a568"
};
const ATT = { "sh.marzouk20@gmail.com": "shaban.marzouk", "islam.alfedawy@gb-auto.com": "islam el fedawy" }; // الحضور والإجازات
const GRP = { // مسؤولو المجموعات فقط
  "sh.marzouk20@gmail.com": "shaban.marzouk",
  "raafat.nasr@gb-auto.com": "رافت",
  "abdelrehim.sayem@gb-auto.com": "رحيم",
  "alomran.fadl@gb-auto.com": "عمران",
  "beshoy.dawood@gb-auto.com": "بيشوي",
  "m.georgy@gb-auto.com": "مينا لطفي",
  "omar.tarek@gb-auto.com": "عمر طارق",
  "s.ibrahim@gb-auto.com": "صلاح",
  "sobhy.heshmat@gb-auto.com": "صبحي"
};
const USERS = { ...ATT, ...GRP };
const WORKSHOP = ["رحيم","صبحي","بيشوي","صلاح","عمران","رأفت","مصطفي"];
const COLORS = ["#2563eb","#db2777","#059669","#d97706","#7c3aed","#0891b2","#4d7c0f"];

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc,addDoc,collection,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const DAYS=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
const D={"السبت":0,"الأحد":1,"الاثنين":2,"الثلاثاء":3,"الأربعاء":4,"الخميس":5,"الجمعة":6};
const mk=(n,a,b,s="")=>({name:n,off:[D[a],D[b]],sub:s});
let engineers=[
 mk("نصار","الخميس","الجمعة","نانسي"),mk("اسماعيل","الخميس","الجمعة","عباس"),
 mk("مارجريت","الجمعة","السبت","فؤاد"),mk("نانسي","الأحد","الاثنين"),
 mk("زياد","الثلاثاء","الأربعاء","احمد رجب"),mk("طه","الأحد","الأربعاء","خالد"),
 mk("عبدالعزيز","الجمعة","السبت","عبدالرحمن"),mk("خالد","الجمعة","السبت"),
 mk("عبدالرحمن","الثلاثاء","الأربعاء"),mk("فؤاد","الاثنين","الثلاثاء","اسماعيل سيد"),
 mk("سارة","الأربعاء","الخميس"),mk("عباس","الاثنين","الثلاثاء","اسماعيل"),
 mk("احمد رجب","الأحد","الاثنين"),mk("اسماعيل سيد","الخميس","السبت")
];
let day=(new Date().getDay()+1)%7, user=null, groups={}, tab="att", brush=0;
const $=id=>document.getElementById(id);
const ref=doc(db,"config","schedule"), refG=doc(db,"config","groups");
const av=n=>`<span class="av" style="background:hsl(${(n.charCodeAt(0)*47+n.length*31)%360} 55% 42%)">${n[0]}</span>`;

function render(){renderDays();renderAtt();renderGroups();showTab()}
function showTab(){$("vAtt").hidden=tab!="att";$("vGrp").hidden=tab!="grp";
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}
function renderDays(){
  $("days").innerHTML=DAYS.map((d,i)=>{const l=engineers.filter(e=>e.off.includes(i)).length;
    return `<button class="day ${i==day?"on":""}" data-d="${i}"><b>${d}</b><small>${engineers.length-l} حضور</small><small>${l} إجازة</small></button>`}).join("");
}
function renderAtt(){
  const pres=[],off=[];engineers.forEach((e,i)=>(e.off.includes(day)?off:pres).push([e,i]));
  $("pc").textContent=pres.length;$("lc").textContent=off.length;
  $("pl").innerHTML=pres.map(([e,i])=>`<div class="row">${av(e.name)}<span class="n">${e.name}</span><button class="ic minus edit" data-a="off" data-i="${i}" title="نقل للإجازة">−</button></div>`).join("")||'<div class="sub">لا أحد</div>';
  $("ll").innerHTML=off.map(([e,i])=>`<div class="row">${av(e.name)}<span class="n">${e.name}<small>البديل: <b>${e.sub||"غير محدد"}</b></small></span><button class="ic pen edit" data-a="sub" data-i="${i}" title="تعديل البديل">✎</button><button class="ic plus edit" data-a="on" data-i="${i}" title="نقل للحضور">+</button></div>`).join("")||'<div class="sub">لا أحد</div>';
}
function norm(raw){const o={};for(const k in raw){const v=raw[k];
  if(Array.isArray(v)){const a={};v.forEach(g=>(g.members||[]).forEach(n=>a[n]=g.name==="بيشوي اكسبريس"?"بيشوي":g.name));o[k]={a,x:""}}else o[k]=v}return o}
function gd(){const g=groups[day];return{a:(g&&g.a)||{},x:(g&&g.x)||""}}
function renderGroups(){
  const g=gd(), pres=engineers.filter(e=>!e.off.includes(day)).map(e=>e.name);
  $("brush").innerHTML=WORKSHOP.map((w,wi)=>`<button class="br ${wi==brush?"on":""}" style="--c:${COLORS[wi%COLORS.length]}" data-a="brush" data-w="${wi}">${w}</button>`).join("");
  $("pool").innerHTML=pres.filter(n=>!g.a[n]).map(n=>`<button class="chip" data-a="gasg" data-n="${n}">${n}</button>`).join("")||'<span class="sub">تم توزيع الجميع ✔</span>';
  $("gcards").innerHTML=WORKSHOP.map((w,wi)=>{const m=pres.filter(n=>g.a[n]===w);
    return `<div class="gc" style="--c:${COLORS[wi%COLORS.length]}"><div class="gh"><b>🔧 ${w}</b>${g.x===w?'<span class="xb">⚡ اكسبريس</span>':""}<span class="cnt">${m.length}</span><button class="xbtn gedit ${g.x===w?"on":""}" data-a="gexp" data-w="${wi}" title="اكسبريس">⚡</button></div><div class="gm">${m.map(n=>`<button class="chip" data-a="grem" data-n="${n}">${n}</button>`).join("")||'<span class="sub">لا أحد</span>'}</div></div>`}).join("");
  $("xp").innerHTML=g.x?`⚡ الاكسبريس اليوم: ${g.x}`:"⚡ الاكسبريس: لم يُحدد بعد";
}
async function save(text){
  if(!user)return;
  try{await setDoc(ref,{engineers});await addDoc(collection(db,"logs"),{user:USERS[user]||user,action:text,ts:serverTimestamp()})}
  catch(e){alert("فشل الحفظ: لا تملك صلاحية أو لا يوجد اتصال")}
}
async function saveG(text){
  try{await setDoc(refG,{groups});await addDoc(collection(db,"logs"),{user:USERS[user]||user,action:text,ts:serverTimestamp()})}
  catch(e){alert("فشل الحفظ: لا تملك صلاحية أو لا يوجد اتصال")}
}
function gClick(b){
  if(!(user in GRP))return;
  const cur=gd(), g=groups[day]={a:cur.a,x:cur.x}, Dn=DAYS[day], a=b.dataset.a;
  if(a=="gexp"){const w=WORKSHOP[+b.dataset.w];
    if(g.x===w){g.x="";saveG(`إلغاء الاكسبريس (${w}) يوم ${Dn}`)}else{g.x=w;saveG(`تحديد ${w} للاكسبريس يوم ${Dn}`)}}
  if(a=="gasg"){const n=b.dataset.n,w=WORKSHOP[brush];g.a[n]=w;saveG(`تعيين ${n} مع ${w} يوم ${Dn}`)}
  if(a=="grem"){const n=b.dataset.n,w=g.a[n];delete g.a[n];saveG(`إزالة ${n} من مجموعة ${w} يوم ${Dn}`)}
  renderGroups();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a;
  if(b.dataset.d!==undefined){day=+b.dataset.d;render();return}
  if(b.dataset.t){tab=b.dataset.t;showTab();return}
  if(a=="brush"){brush=+b.dataset.w;renderGroups();return}
  if(!a||!user)return;
  if(["gasg","grem","gexp"].includes(a)){gClick(b);return}
  if(!(user in ATT))return;
  const en=engineers[+b.dataset.i];if(!en)return;
  if(a=="off"){en.off=[...new Set([...en.off,day])];save(`نقل ${en.name} إلى إجازة يوم ${DAYS[day]}`)}
  if(a=="on"){en.off=en.off.filter(x=>x!=day);save(`نقل ${en.name} إلى حضور يوم ${DAYS[day]}`)}
  if(a=="sub"){const v=prompt(`البديل للمهندس ${en.name}:`,en.sub);if(v===null)return;
    const old=en.sub;en.sub=v.trim();save(`تغيير بديل ${en.name} من "${old||"-"}" إلى "${en.sub||"-"}"`)}
  render();
});
onSnapshot(refG,s=>{groups=s.exists()?norm(s.data().groups||{}):{};renderGroups()},()=>{});
onSnapshot(ref,s=>{if(s.exists()){engineers=s.data().engineers;render()}},()=>{});
onSnapshot(query(collection(db,"logs"),orderBy("ts","desc"),limit(15)),s=>{
  $("logList").innerHTML=s.docs.map(d=>{const x=d.data();const t=x.ts?x.ts.toDate().toLocaleString("ar-EG"):"";
    return `<div>${t} — <b>${x.user}</b>: ${x.action}</div>`}).join("")||"لا يوجد تعديلات بعد";
},()=>{});
$("loginBtn").onclick=()=>{if(user){signOut(auth)}else{$("msg").textContent="";$("dlg").showModal()}};
$("cancel").onclick=()=>$("dlg").close();
$("f").onsubmit=async ev=>{
  ev.preventDefault();
  try{await signInWithEmailAndPassword(auth,$("u").value.trim().toLowerCase(),$("pw").value);$("dlg").close();$("pw").value=""}
  catch(e){$("msg").textContent="بيانات الدخول غير صحيحة";$("dlg").showModal()}
};
onAuthStateChanged(auth,u=>{
  user=u?u.email.toLowerCase():null;
  document.body.classList.toggle("att",!!user&&user in ATT);
  document.body.classList.toggle("grp",!!user&&user in GRP);
  $("who").textContent=user?("👤 "+(USERS[user]||user)):"عرض فقط";
  $("loginBtn").textContent=user?"تسجيل خروج":"دخول للتعديل";
});
render();
</script>
</body>
</html>
